<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Calendar</title>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem("calendar.settings") || "{}").theme || "system";
        document.documentElement.dataset.theme =
          t === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : t;
        if (JSON.parse(localStorage.getItem("calendar.settings") || "{}").privacy)
          document.documentElement.setAttribute("data-privacy", "");
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
