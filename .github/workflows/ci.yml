name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      # Type-checks (tsc) and builds the web app + booking page.
      - run: npm run build

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
        working-directory: server
      - run: npm run check
        working-directory: server

  desktop:
    runs-on: ubuntu-latest
    # Slow (full Rust build), so it's opt-in: set the repository variable DESKTOP_CI to "true".
    if: vars.DESKTOP_CI == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # System libraries Tauri needs on Linux.
      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The Tauri build embeds the web build, so it has to exist before compiling.
      - run: npm ci
      - run: npm run build

      - run: cargo check
        working-directory: src-tauri

  docker-build:
    runs-on: ubuntu-latest
    needs: [web, server]
    # Catch a broken Dockerfile on pull requests; publishing happens in deployment.yaml.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
